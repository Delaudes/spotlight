<div class="flex gap-2">
  @for (mode of viewModel.grid.lightModeOptions; track mode) {
    <button [attr.data-testid]="'light-mode-' + mode"
      class="px-8 h-12 rounded-full font-semibold transition-colors border"
      [class.bg-cyan-400]="viewModel.grid.lightMode === mode"
      [class.text-black]="viewModel.grid.lightMode === mode"
      [class.border-cyan-400]="viewModel.grid.lightMode === mode"
      [class.hover:bg-cyan-300]="viewModel.grid.lightMode === mode"
      [class.bg-gray-900]="viewModel.grid.lightMode !== mode"
      [class.text-cyan-400]="viewModel.grid.lightMode !== mode"
      [class.border-cyan-400/20]="viewModel.grid.lightMode !== mode"
      [class.hover:bg-gray-800]="viewModel.grid.lightMode !== mode"
      (click)="controller.updateGrid(viewModel.grid.size, mode)"
    >
      {{ mode }}
    </button>
  }
</div>
