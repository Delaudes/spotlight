<div class="min-h-screen bg-black flex items-center justify-center p-4 pb-24 md:pb-4">
  <div class="w-full max-w-2xl space-y-12 flex flex-col items-center">
    <!-- Title Section -->
    <div class="text-center" data-testid="title-section">
      <h1 class="text-6xl font-bold text-white">
        {{ viewModel.title }}
      </h1>
      <p class="text-2xl text-cyan-400 mt-3">
        {{ viewModel.subtitle }}
      </p>
    </div>

    <!-- Desktop Navigation Buttons -->
    <div class="hidden md:flex gap-4">
      <button
        data-testid="home-button"
        class="w-12 h-12 flex items-center justify-center bg-gray-900 hover:bg-gray-800 text-cyan-400 rounded-full transition-colors border border-cyan-400/20"
        (click)="controller.navigateToHome()"
      >
        <span class="material-symbols-outlined">home</span>
      </button>
      <button
        data-testid="play-button"
        class="w-12 h-12 flex items-center justify-center bg-cyan-400 hover:bg-cyan-300 text-black rounded-full transition-colors"
        (click)="controller.navigateToGame()"
      >
        <span class="material-symbols-outlined">play_arrow</span>
      </button>
    </div>

    <!-- Trophies Grid -->
    <div class="w-full grid grid-cols-2 gap-4">
      @for (trophy of viewModel.trophies; track trophy.title) {
      <app-trophy [attr.data-testid]="`trophy-${trophy.title}`" [trophy]="trophy" />
      } @empty {
      <!-- Empty State -->
      <div
        data-testid="empty"
        class="col-span-2 border border-cyan-400/20 rounded-2xl p-8 text-center"
      >
        <p class="text-gray-300">
          {{ viewModel.emptyTrophiesMessage }}
        </p>
      </div>
      }
    </div>
  </div>

  <!-- Mobile Navigation - Fixed Bottom -->
  <div
    class="md:hidden fixed bottom-0 left-0 right-0 flex justify-center gap-4 p-4 bg-black border-t border-cyan-400/20"
  >
    <button
      class="w-12 h-12 flex items-center justify-center bg-gray-900 hover:bg-gray-800 text-cyan-400 rounded-full transition-colors border border-cyan-400/20"
      (click)="controller.navigateToHome()"
    >
      <span class="material-symbols-outlined">home</span>
    </button>
    <button
      class="w-12 h-12 flex items-center justify-center bg-cyan-400 hover:bg-cyan-300 text-black rounded-full transition-colors"
      (click)="controller.navigateToGame()"
    >
      <span class="material-symbols-outlined">play_arrow</span>
    </button>
  </div>
</div>
