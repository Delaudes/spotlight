<div class="min-h-screen bg-black flex items-center justify-center p-4">
  <div class="w-full max-w-2xl space-y-12 flex flex-col items-center">
    
    <!-- Title Section -->
    <div class="text-center" data-testid="title-section">
      <h1 class="text-6xl font-bold text-white">
        {{ viewModel.title }}
      </h1>
      <p class="text-2xl text-cyan-400 mt-3">
        {{ viewModel.subtitle }}
      </p>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex gap-4">
      <button
        data-testid="home-button"
        class="w-12 h-12 flex items-center justify-center bg-gray-900 hover:bg-gray-800 text-cyan-400 rounded-full transition-colors border border-cyan-400/20"
        (click)="controller.navigateToHome()"
      >
        <span class="material-symbols-outlined">home</span>
      </button>
      <button
        data-testid="play-button"
        class="w-12 h-12 flex items-center justify-center bg-cyan-400 hover:bg-cyan-300 text-black rounded-full transition-colors"
        (click)="controller.navigateToGame()"
      >
        <span class="material-symbols-outlined">play_arrow</span>
      </button>
    </div>

    <!-- Trophies Grid -->
    <div class="w-full grid grid-cols-2 gap-4">
      @for (trophy of viewModel.trophies; track trophy.title) {
        <div class="border border-cyan-400/20 rounded-2xl p-4 flex flex-col items-center justify-between gap-3 h-32">
          <!-- Trophy Mini Grid (dots) -->
          <div class="flex flex-col gap-0.5 flex-1 justify-center">
            @for (row of trophy.grid; track $index) {
              <div class="flex gap-0.5">
                @for (cell of row; track cell.x + '-' + cell.y) {
                  <div
                    class="w-1.5 h-1.5 rounded-full"
                    [class.bg-cyan-400]="cell.lightLevel === 2"
                    [class.bg-cyan-400/50]="cell.lightLevel === 1"
                    [class.bg-gray-600]="cell.lightLevel === 0"
                  ></div>
                }
              </div>
            }
          </div>
          
          <!-- Trophy Title -->
          <p class="text-cyan-400 text-center font-semibold text-xs">
            {{ trophy.title }}
          </p>
        </div>
      } @empty {
        <!-- Empty State -->
        <div class="col-span-2 border border-cyan-400/20 rounded-2xl p-8 text-center">
          <p class="text-gray-300">
            {{ viewModel.emptyTrophiesMessage }}
          </p>
        </div>
      }
    </div>

  </div>
</div>
