<div class="min-h-screen bg-black flex items-center justify-center p-4">
  <div class="max-w-2xl space-y-12 text-center">
    <!-- Title Section -->
    <div data-testid="title-section">
      <h1 class="text-6xl font-bold text-white">
        {{ viewModel.title }}
      </h1>
      <p class="text-2xl text-cyan-400 mt-3">
        {{ viewModel.subtitle }}
      </p>
    </div>

    <!-- Game Rules -->
    <p class="text-gray-300 border border-cyan-400/20 rounded-2xl p-8" data-testid="game-rules">
      {{ viewModel.gameRules }}
    </p>

    <!-- Call to Action -->
    <button
      data-testid="play-button"
      class="bg-cyan-400 hover:bg-cyan-300 text-black font-semibold px-12 py-4 rounded-full transition-colors"
      (click)="homeController.navigateToGame()"
    >
      {{ viewModel.playButtonLabel }}
    </button>
  </div>
</div>
