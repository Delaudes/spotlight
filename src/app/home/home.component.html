<div class="min-h-screen bg-black flex items-center justify-center p-4">
  <div class="max-w-2xl space-y-12 text-center">
    <div>
      <h1 class="text-6xl font-bold text-white">
        {{ viewModel.title }}
      </h1>
      <p class="text-2xl text-cyan-400 mt-3">
        {{ viewModel.subtitle }}
      </p>
    </div>

    <p class="text-gray-300 border border-cyan-400/20 rounded-2xl p-8">
      {{ viewModel.gameRules }}
    </p>

    <button
      class="bg-cyan-400 hover:bg-cyan-300 text-black font-semibold px-12 py-4 rounded-full"
      (click)="homeController.navigateToGame()"
    >
      {{ viewModel.playButtonLabel }}
    </button>
  </div>
</div>
